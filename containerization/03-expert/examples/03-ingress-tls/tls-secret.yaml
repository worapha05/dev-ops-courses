# ตัวอย่างโครงสร้างเท่านั้น — แทนที่ด้วยค่าจาก openssl จริงก่อนใช้
# หรือสร้างด้วย: kubectl create secret tls shop-tls --cert=tls.crt --key=tls.key
apiVersion: v1
kind: Secret
metadata:
  name: shop-tls
type: kubernetes.io/tls
stringData:
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE_ME
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_ME
    -----END PRIVATE KEY-----
