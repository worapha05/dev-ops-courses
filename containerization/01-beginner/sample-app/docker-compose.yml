services:
  frontend:
    build: ./frontend
    ports:
      - '8080:80'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - shoplite-net

  backend:
    build: ./backend
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: ${DATABASE_URL:-postgres://shoplite:shoplite_dev@db:5432/shoplite}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - shoplite-net

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shoplite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shoplite_dev}
      POSTGRES_DB: ${POSTGRES_DB:-shoplite}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shoplite -d shoplite']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - shoplite-net

volumes:
  pgdata:

networks:
  shoplite-net:
    driver: bridge
