name: Multi-language dependency cache examples

on:
  workflow_dispatch:

jobs:
  npm-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('01-beginner/sample-app/package-lock.json', '01-beginner/sample-app/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
        working-directory: 01-beginner/sample-app

  pip-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            **/requirements.txt
      - name: Demo requirements (optional file)
        run: |
          echo "ถ้ามี requirements.txt จะได้ cache อัตโนมัติจาก setup-python"

  go-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: |
            **/go.sum
      - name: Demo
        run: echo "setup-go จะ cache module download เมื่อมี go.sum"
