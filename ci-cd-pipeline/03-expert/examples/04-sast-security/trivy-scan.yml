name: Trivy SAST / Image Scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  trivy-fs:
    name: Trivy filesystem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy FS scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: 01-beginner/sample-app
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  trivy-image:
    name: Trivy image
    runs-on: ubuntu-latest
    needs: [trivy-fs]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./01-beginner/sample-app
          push: false
          load: true
          tags: sample-app:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: sample-app:scan
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
