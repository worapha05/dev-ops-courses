name: ShopFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: 01-beginner/sample-app/package-lock.json
      - name: Install, lint, test
        working-directory: 01-beginner/sample-app
        run: |
          npm install
          npm run lint
          npm test

  package:
    name: Package artifact
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Zip dist
        run: |
          mkdir -p dist
          cp -r 01-beginner/sample-app/src 01-beginner/sample-app/package.json dist/
          zip -r "shopflow-${GITHUB_SHA}.zip" dist
      - uses: actions/upload-artifact@v4
        with:
          name: shopflow-${{ github.sha }}
          path: shopflow-*.zip
          retention-days: 7

  notify:
    name: Optional secret usage
    runs-on: ubuntu-latest
    needs: [package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Check webhook secret without leaking
        env:
          SHOPFLOW_SLACK_WEBHOOK: ${{ secrets.SHOPFLOW_SLACK_WEBHOOK }}
        run: |
          if [ -z "${SHOPFLOW_SLACK_WEBHOOK}" ]; then
            echo "ไม่มี SHOPFLOW_SLACK_WEBHOOK — skip notify"
            exit 0
          fi
          echo "webhook_length=${#SHOPFLOW_SLACK_WEBHOOK}"
          # ตัวอย่างจริง: curl -X POST -d '{"text":"ShopFlow main build OK"}' "$SHOPFLOW_SLACK_WEBHOOK"
