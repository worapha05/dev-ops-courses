name: CI — Tests & Artifacts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: 01-beginner/sample-app/package-lock.json

      - name: Install
        working-directory: 01-beginner/sample-app
        run: npm install

      - name: Lint
        working-directory: 01-beginner/sample-app
        run: npm run lint

      - name: Test
        working-directory: 01-beginner/sample-app
        run: npm test

      - name: Create zip artifact
        run: |
          mkdir -p dist
          cp -r 01-beginner/sample-app/src 01-beginner/sample-app/package.json dist/
          zip -r "sample-app-${GITHUB_SHA}.zip" dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sample-app-${{ github.sha }}
          path: sample-app-*.zip
          retention-days: 7
