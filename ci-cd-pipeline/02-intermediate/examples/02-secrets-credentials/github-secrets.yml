name: Secrets Demo (safe patterns)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/github-secrets.yml'
      - '02-intermediate/examples/02-secrets-credentials/**'

jobs:
  use-repo-secret:
    name: Use repository secret
    runs-on: ubuntu-latest
    steps:
      - name: Prove secret is available without printing it
        env:
          DEMO_API_TOKEN: ${{ secrets.DEMO_API_TOKEN }}
        run: |
          if [ -z "${DEMO_API_TOKEN}" ]; then
            echo "DEMO_API_TOKEN is empty — สร้าง GitHub Secret ก่อน"
            exit 1
          fi
          echo "token_length=${#DEMO_API_TOKEN}"
          # ห้าม: echo "$DEMO_API_TOKEN"

  use-environment-secret:
    name: Use environment secret
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Staging-only secret scope
        env:
          DEMO_API_TOKEN: ${{ secrets.DEMO_API_TOKEN }}
        run: |
          echo "running in environment=staging"
          echo "token_length=${#DEMO_API_TOKEN}"
