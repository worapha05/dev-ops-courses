name: CI — Beginner Basics

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: 01-beginner/sample-app/package-lock.json

      - name: Install dependencies
        working-directory: 01-beginner/sample-app
        run: npm install

      - name: Lint
        working-directory: 01-beginner/sample-app
        run: npm run lint

      - name: Unit tests
        working-directory: 01-beginner/sample-app
        run: npm test
