name: NovaPay CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    name: Lint & Test
    runs-on: ubuntu-latest
    env:
      APP_ENV: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show event context
        run: |
          echo "event=${{ github.event_name }}"
          echo "sha=${{ github.sha }}"
          echo "APP_ENV=$APP_ENV"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: 01-beginner/sample-app
        run: npm install

      - name: Lint
        working-directory: 01-beginner/sample-app
        run: npm run lint

      - name: Unit tests
        working-directory: 01-beginner/sample-app
        run: npm test
